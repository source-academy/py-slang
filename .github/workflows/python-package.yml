name: python-package

# Tests the CPython `sicp` library in `python/` on every change to it, and
# publishes it to PyPI (as `sourceacademy-sicp`) when a GitHub Release is
# published. Publishing is deliberate and release-gated — never on a push.

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python-package.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-package.yml"
  release:
    types: [published]

defaults:
  run:
    working-directory: python

jobs:
  format:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip "black==26.5.1"
      - name: Check formatting with Black
        run: black --check --diff .

  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest build
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel + sdist
        run: python -m build

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC) — configure a trusted publisher for the
    # `sourceacademy-sicp` project on PyPI pointing at this repo/workflow, or
    # swap the publish step for a token-based upload using a PYPI_API_TOKEN secret.
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches pyproject.toml version
        # A release tagged sicp-vX.Y.Z whose pyproject.toml version doesn't
        # match builds dist files for the *wrong* version. PyPI then either
        # silently publishes under the wrong version or, if that version was
        # already released, rejects the upload with "400 File already exists"
        # (see sicp-v0.2.0, which was tagged before the version bump landed).
        run: |
          tag_version="${GITHUB_REF_NAME#sicp-v}"
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${pkg_version}'. Bump the version and re-tag before releasing."
            exit 1
          fi
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install -e .
      - name: Run tests before publishing
        run: python -m pytest -q
      - name: Build wheel + sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
