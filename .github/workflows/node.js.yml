# Credits to https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
# for the code.

name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run build --all
      - run: yarn run format:ci
      - run: yarn run lint
      # The differential tests compare against CPython, whose behaviour differs between versions,
      # so pin it instead of using whatever python3 the runner image ships (ubuntu-latest moved
      # from Ubuntu 24.04 to 26.04, and with it the system Python).
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests (including CPython ground-truth checks for sourceacademy-sicp)
        run: yarn run test-coverage
        env:
          CPYTHON_PATH: python3
      - name: Run pyodide evaluator tests
        run: yarn run test:pyodide
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
